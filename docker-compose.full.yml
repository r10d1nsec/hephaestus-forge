# Hephaestus' Forge — perfil completo (+ Ollama con GPU).
# Levanta un Ollama dentro de la red para modelos 100% locales.
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - hephaestus_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/hephaestus.db
      - OLLAMA_URL=http://ollama:11434
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hephaestus_data:
  ollama_data:
